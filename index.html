<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HÍDRICA - TIPÓN</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf4fc;font-family:Arial,sans-serif;color:#102b50}
main{max-width:560px;margin:auto;padding:18px}
h1{font-size:28px}
.card{background:white;border-radius:16px;padding:18px;margin:15px 0}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;background:#0755b2;color:white;font-size:17px;font-weight:bold}
button.secondary{background:#345675}
button:disabled{opacity:.5}
input{width:100%;padding:15px;border:1px solid #adc2dc;border-radius:10px;font-size:16px}
video{width:100%;display:block;background:#111;border-radius:12px}
#cameraBox{position:relative;display:none;overflow:hidden}
#cameraBox:after{content:"";position:absolute;inset:15%;border:4px solid #44d36e;border-radius:12px;pointer-events:none}
#status{padding:14px;border-radius:10px;background:#e8eef7;white-space:pre-wrap;line-height:1.5}
.ok{background:#d9f7e4!important}
.err{background:#ffe0e0!important}
.small{font-size:14px;color:#526a85}
</style>
</head>
<body>
<main>
<h1>HÍDRICA – TIPÓN</h1>
<p class="small">Control de asistencia de estudiantes</p>

<section class="card">
<h2>Escanear boleto QR</h2>
<div id="cameraBox">
<video id="video" autoplay muted playsinline></video>
</div>
<canvas id="canvas" style="display:none"></canvas>
<button id="start" onclick="startCamera()">Abrir cámara y escanear</button>
<button class="secondary" onclick="stopCamera()">Cerrar cámara</button>
<p id="status">Presiona «Abrir cámara y escanear».</p>
</section>

<section class="card">
<h2>Código del estudiante</h2>
<p class="small">Al reconocer el QR, aparecerá aquí.</p>
<input id="codigo" placeholder="HID-...-IDA o HID-...-VUELTA" autocomplete="off">
<button onclick="continuar()">Continuar a registro</button>
<button class="secondary" onclick="verResumen()">Ver resumen</button>
</section>
</main>

<script>
const APP_URL =
'https://script.google.com/macros/s/AKfycbwprYOsJB2mwG7RWAkysyZg0CCdVyMKNQje8VKlBpQNuJrr51-hJvj4aZP29ifTtVISFg/exec';

const $ = id => document.getElementById(id);
let stream = null;
let running = false;
let frameId = null;
let lastScan = 0;

function mensaje(texto,tipo=''){
 const e=$('status');
 e.textContent=texto;
 e.className=tipo;
}

function validar(c){
 return /^HID-[A-F0-9]{16}-(IDA|VUELTA)$/.test(c);
}

async function startCamera(){
 if(running)return;
 if(typeof jsQR!=='function'){
  mensaje('No se cargó el lector QR. Revisa Internet.','err');
  return;
 }
 try{
  $('codigo').value='';
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:'environment'},
    width:{ideal:1280},
    height:{ideal:720}
   }
  });

  const video=$('video');
  video.srcObject=stream;
  await video.play();
  running=true;
  lastScan=0;
  $('cameraBox').style.display='block';
  mensaje('Cámara activa. Enfoca un solo QR de IDA o VUELTA.');
  frameId=requestAnimationFrame(leerQR);
 }catch(e){
  mensaje('Error de cámara: '+e.message,'err');
  stopCamera();
 }
}

function leerQR(tiempo){
 if(!running)return;
 frameId=requestAnimationFrame(leerQR);
 if(tiempo-lastScan<100)return;
 lastScan=tiempo;

 const video=$('video');
 if(video.readyState<2 || !video.videoWidth)return;

 const canvas=$('canvas');
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 ctx.drawImage(video,0,0,canvas.width,canvas.height);

 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
 const result=jsQR(pixels.data,canvas.width,canvas.height,{
  inversionAttempts:'attemptBoth'
 });

 if(!result)return;

 const codigo=result.data.trim().toUpperCase();

 if(!validar(codigo)){
  mensaje('Se detectó un QR, pero no es un boleto HÍDRICA válido.','err');
  return;
 }

 $('codigo').value=codigo;
 mensaje('QR LEÍDO CORRECTAMENTE: '+codigo+
 '\nAhora presiona «Continuar a registro».','ok');
 stopCamera();
}

function stopCamera(){
 running=false;
 if(frameId!==null){
  cancelAnimationFrame(frameId);
  frameId=null;
 }
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 $('video').srcObject=null;
 $('cameraBox').style.display='none';
}

function continuar(){
 const codigo=$('codigo').value.trim().toUpperCase();
 if(!validar(codigo)){
  mensaje('Primero escanea un QR válido de HÍDRICA.','err');
  return;
 }
 window.location.href=APP_URL+'?codigo='+encodeURIComponent(codigo);
}

function verResumen(){
 window.location.href=APP_URL;
}
</script>
</body>
</html>
